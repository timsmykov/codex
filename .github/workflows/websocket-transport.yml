name: WebSocket transport verification

on:
  push:
    branches: [fix/websocket-idle-probe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: websocket-transport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      RUST_MIN_STACK: "8388608"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          components: rustfmt, clippy
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libssl-dev libcap-dev protobuf-compiler
      - name: Check formatting
        run: cargo fmt --all -- --config imports_granularity=Item --check
      # Release tags bump workspace versions without regenerating Cargo.lock.
      # Cargo normalizes those local package versions; dependency versions remain pinned.
      - name: Test complete API crate
        run: cargo test -p codex-api
      - name: Test model-client WebSockets
        run: |
          cargo test --locked -p codex-core --test all suite::client_websockets::
      - name: Lint affected API crate
        run: cargo clippy --locked -p codex-api --lib --tests -- -D warnings
      - name: Build matching sandbox resource
        run: |
          cargo build --locked --release --bin bwrap
          strip target/release/bwrap
          echo "CODEX_BWRAP_SHA256=$(sha256sum target/release/bwrap | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Build candidate backend
        env:
          STABLE_GIT_COMMIT: ${{ github.sha }}
        run: |
          cargo build --locked --release --bin codex
          strip target/release/codex
          target/release/codex --version
          sha256sum target/release/codex target/release/bwrap > target/release/SHA256SUMS
      - name: Upload candidate and checksums
        uses: actions/upload-artifact@v4
        with:
          name: codex-websocket-linux-x86_64-${{ github.sha }}
          path: |
            codex-rs/target/release/codex
            codex-rs/target/release/bwrap
            codex-rs/target/release/SHA256SUMS
          retention-days: 14
